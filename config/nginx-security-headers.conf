# Nginx Security Headers for socpulse.ru
#
# Deployment:
#   1. Copy this file to the server:
#      scp config/nginx-security-headers.conf root@socpulse.ru:/etc/nginx/snippets/security-headers.conf
#   2. Include in your server block:
#      include /etc/nginx/snippets/security-headers.conf;
#   3. Test and reload:
#      nginx -t && systemctl reload nginx

# HTTPS only — force browsers to use HTTPS for 1 year
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Prevent MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# XSS filter
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions policy — disable unused browser features
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content Security Policy
# - self: own origin
# - unsafe-inline/unsafe-eval: required by Vite/React build
# - tile.openstreetmap.org: Leaflet map tiles
# - *.supabase.co: Supabase API and realtime (wss)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; frame-ancestors 'none';" always;
